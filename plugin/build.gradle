plugins {
    id "groovy"
}

apply plugin: "org.apache.grails.gradle.grails-gsp"
apply plugin: "org.apache.grails.gradle.grails-plugin"

version = project.projectVersion
group = "org.grails.plugins"

dependencies {
    compileOnly platform("org.apache.grails:grails-bom:$grailsVersion")
    compileOnly('org.apache.grails:grails-dependencies-starter-web')

    console("org.apache.grails:grails-console")

    // Served by Spring Boot's /webjars/** classpath mapping in the consuming app.
    // The platform manages jQuery, Bootstrap and Bootstrap Icons, so no version is
    // stated for them; the generated GSP resolves whatever the consuming app's own
    // dependency management settles on regardless (see WebjarVersions). CodeMirror
    // is not in the BOM, so those versions live in gradle.properties.
    runtimeOnly platform("org.apache.grails:grails-bom:$grailsVersion")
    runtimeOnly "org.webjars.npm:jquery"
    // CodeMirror 6 is ESM-only, so index.gsp emits an import map over these and a
    // module shim rather than plain script tags. Only the three roots are declared
    // — @codemirror/state, view and language are dependencies of all of them, and
    // arrive transitively along with @lezer/*, style-mod, crelt, w3c-keyname and
    // @marijn/find-cluster-break.
    runtimeOnly "org.webjars.npm:codemirror__commands:${project.codeMirrorCommandsVersion}"
    runtimeOnly "org.webjars.npm:codemirror__legacy-modes:${project.codeMirrorLegacyModesVersion}"
    runtimeOnly "org.webjars.npm:codemirror__theme-one-dark:${project.codeMirrorThemeOneDarkVersion}"
    runtimeOnly "org.webjars.npm:bootstrap"
    runtimeOnly "org.webjars.npm:bootstrap-icons"

    testImplementation platform("org.apache.grails:grails-bom:$grailsVersion")
    testImplementation("org.apache.grails:grails-testing-support-web")
    testImplementation("org.spockframework:spock-core")
    testRuntimeOnly 'net.bytebuddy:byte-buddy'
}

apply {
    from project.rootProject.layout.projectDirectory.file('gradle/java-config.gradle')
    from project.rootProject.layout.projectDirectory.file('gradle/test-config.gradle')
}

grails {
    springDependencyManagement = false
}